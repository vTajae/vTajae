# Writes a weekly WakaTime language chart between the waka markers in README.md.
name: Waka Readme

on:
  schedule:
    - cron: "30 18 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Skip cleanly (instead of failing) when the WakaTime key is not configured.
      - name: Check WakaTime key
        id: check
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -z "$WAKATIME_API_KEY" ]; then
            echo "::notice::WAKATIME_API_KEY secret is not set; skipping stats update."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: athul/waka-readme@v0.3.1
        if: steps.check.outputs.ready == 'true'
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TOTAL: true
          COMMIT_MESSAGE: "chore: update coding stats"
